<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Luméa Communication</title>

  <!-- Hreflang -->
  <link rel="alternate" hreflang="fr-CH" href="https://lumeacommunication.ch/ch/">
  <link rel="alternate" hreflang="fr-FR" href="https://lumeacommunication.fr/fr/">
  <link rel="alternate" hreflang="es-ES" href="https://lumeacommunication.ch/es/">
  <link rel="alternate" hreflang="x-default" href="https://lumeacommunication.ch/ch/">

  <script>
    (function () {
      var host = (location.hostname || '').toLowerCase();
      var target = '/ch/'; // défaut (x-default)

      if (host.indexOf('lumeacommunication.fr') !== -1) target = '/fr/';
      if (host.indexOf('lumeacommunication.es') !== -1) target = '/es/';

      // Redirection immédiate (remplace l'historique)
      location.replace(target);
    })();
  </script>

  <noscript>
    <meta http-equiv="refresh" content="0; url=/ch/">
  </noscript>
</head>
<body>
  <p>Redirection… Si rien ne se passe : <a href="/ch/">Suisse</a> · <a href="/fr/">France</a> · <a href="/es/">España</a></p>
  <script src="assets/js/analytics.js" defer></script>
</body>
</html>
